name: Build, Test, and Deploy Hugo Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install Hugo Extended (Latest Official Release)
        run: |
          HUGO_TAG=$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest | grep -Po '"tag_name": "\K.*?(?=")')
          HUGO_VER="${HUGO_TAG#v}"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/${HUGO_TAG}/hugo_extended_${HUGO_VER}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VER}_linux-amd64.deb"
          rm -f "hugo_extended_${HUGO_VER}_linux-amd64.deb"
          hugo version

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo (Strict)
        run: |
          hugo \
            --gc \
            --minify \
            --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Run Output & RSS Assertions
        run: |
          test -s public/index.html
          test -s public/404.html
          test -s public/index.xml
          xmllint --noout public/index.xml
          grep -q "<item>" public/index.xml

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4